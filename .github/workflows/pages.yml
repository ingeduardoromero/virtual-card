name: Deploy card to Pages

# Your details are not in the repository. They live in a repository secret
# named CARD_JSON (the contents of your local card.json), and this workflow
# builds index.html from it. Set or update it with:
#
#   gh secret set CARD_JSON < card.json && gh workflow run pages.yml
#
# or Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node scripts/test.mjs

      - name: Build index.html from the CARD_JSON secret
        env:
          CARD_JSON: ${{ secrets.CARD_JSON }}
        run: |
          if [ -z "$CARD_JSON" ]; then
            echo "::error title=No card details yet::Add a repository secret named CARD_JSON containing your card.json (Settings → Secrets and variables → Actions), or run: gh secret set CARD_JSON < card.json — then run this workflow again."
            exit 1
          fi
          printf '%s' "$CARD_JSON" > card.json
          node scripts/build.mjs

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          shopt -s nullglob
          for f in *.png *.jpg *.jpeg *.svg *.webp *.ico; do cp "$f" _site/; done
          if [ -d qr ]; then cp -r qr _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
