<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eduardo Angel Romero Diaz</title>
<meta name="description" content="Eduardo Angel Romero Diaz — Master of Software Engineering. Save my contact details, or reach me by email, phone, or LinkedIn.">
<meta name="theme-color" content="#0D0F12">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="profile">
<meta property="og:title" content="Eduardo Angel Romero Diaz">
<meta property="og:description" content="Master of Software Engineering. Save my contact details, or reach me by email, phone, or LinkedIn.">
<meta property="og:url" content="https://ingeduardoromero.github.io/virtual-card/">

<meta property="profile:last_name" content="Romero Diaz">

<meta property="og:image" content="https://ingeduardoromero.github.io/virtual-card/preview.png">
<meta property="og:image:width" content="1200">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Eduardo Angel Romero Diaz">
<meta name="twitter:description" content="Master of Software Engineering. Save my contact details, or reach me by email, phone, or LinkedIn.">

<link rel="canonical" href="https://ingeduardoromero.github.io/virtual-card/">

<style>
  /* ---- Night Terminal ---------------------------------------------------
     ground   #0D0F12   text  #F2F3F5   muted #8A9099
     hairline white 10%  signal #C8F751 (button fill + focus ring only)
     No webfonts: the system stack paints on the first frame with zero
     network round trips. SF Pro / SF Mono on iOS, Roboto on Android.
     --------------------------------------------------------------------- */
  :root {
    --ground:   #0D0F12;
    --text:     #F2F3F5;
    --muted:    #8A9099;
    --hairline: rgba(255,255,255,.10);
    --press:    rgba(255,255,255,.045);
    --signal:   #C8F751;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    max-width: 34rem;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + 4.5rem)
      calc(env(safe-area-inset-right) + 1.375rem)
      calc(env(safe-area-inset-bottom) + 3rem)
      calc(env(safe-area-inset-left) + 1.375rem);
  }

  /* ---- Hero ---- */
  h1 {
    margin: 0;
    font-size: clamp(2.625rem, 13.5vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 0.92;
    text-wrap: balance;
    overflow-wrap: break-word;
    hyphens: none;
  }

  .meta {
    margin: 1.5rem 0 0;
    font-family: var(--mono);
    font-size: 0.8125rem;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .meta .sep { opacity: .45; padding: 0 .45em; }

  /* ---- Primary action ---- */
  .save {
    display: block;
    width: 100%;
    margin: 2.75rem 0 3rem;
    padding: 1.0625rem 1rem;
    border: 0;
    border-radius: 3px;
    background: var(--signal);
    color: var(--ground);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.005em;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: opacity .12s ease;
  }
  .save:active { opacity: .78; }
  .save[data-done="1"] { background: transparent; color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }

  /* ---- Contact rows: hairlines, not cards ---- */
  .rows { border-top: 1px solid var(--hairline); }

  .row {
    display: block;
    padding: 1.0625rem 0;
    border-bottom: 1px solid var(--hairline);
    color: inherit;
    text-decoration: none;
    transition: background-color .12s ease;
  }
  .row:active { background-color: var(--press); }

  .row .label {
    display: block;
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .row .value {
    display: block;
    margin-top: 0.1875rem;
    font-size: 1rem;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }

  footer {
    margin-top: 2.5rem;
    font-family: var(--mono);
    font-size: 0.6875rem;
    color: var(--muted);
    opacity: .7;
  }

  /* ---- Accessibility ---- */
  :focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<main>
  <h1 id="name"></h1>
  <p class="meta" id="meta"></p>

  <button class="save" id="save" type="button">Save contact</button>
  <p class="sr-only" role="status" aria-live="polite" id="status"></p>

  <nav class="rows" id="rows" aria-label="Contact"></nav>

  <footer id="footer"></footer>
</main>

<noscript>
  <p style="padding:0 1.375rem 2rem;font-family:monospace;color:#8A9099">
    This card needs JavaScript to render. Email: ingeduardoromero&#64;gmail.com
  </p>
</noscript>

<script>
(function () {
  "use strict";

  /* =====================================================================
     CONFIG — everything personal lives here. Edit only this object.
     Leave any string empty ("") to hide that item entirely.
     ===================================================================== */
  var CONFIG = {
    // Hero. `full` is what's displayed; the parts below are only for the
    // vCard's structured N: field (family;given;additional).
    name: {
      full:       "Eduardo Angel Romero Diaz",
      given:      "Eduardo",
      additional: "Angel",
      family:     "Romero Diaz"
    },

    role:     "Master of Software Engineering",
    location: "",              // e.g. "Mexico City, Mexico" — hidden while empty
    org:      "",              // vCard ORG field — hidden while empty

    email: "ingeduardoromero@gmail.com",

    // Keep full international format. `display` is what the visitor reads;
    // `dial` is what the phone actually calls and what goes in the vCard.
    phone: {
      display: "+52 55 4363 4088",
      dial:    "+525543634088"
    },

    linkedin: {
      url:     "https://www.linkedin.com/in/eduardo-angel-romero-542a5350",
      display: "eduardo-angel-romero"
    },

    // Set `url` to show a GitHub row, e.g.
    // github: { url: "https://github.com/ingeduardoromero", display: "ingeduardoromero" },
    github: { url: "", display: "" },

    website: { url: "", display: "" },

    vcardFilename: "Eduardo-Angel-Romero-Diaz.vcf",
    footerNote:    ""          // optional quiet line at the bottom; hidden while empty
  };
  /* ================== end CONFIG — nothing below needs editing ========== */

  var $ = function (id) { return document.getElementById(id); };

  /* ---- Render -------------------------------------------------------- */

  $("name").textContent = CONFIG.name.full;

  var metaBits = [CONFIG.role, CONFIG.location, CONFIG.org].filter(Boolean);
  var meta = $("meta");
  metaBits.forEach(function (bit, i) {
    if (i) {
      var sep = document.createElement("span");
      sep.className = "sep";
      sep.setAttribute("aria-hidden", "true");
      sep.textContent = "/";
      meta.appendChild(sep);
    }
    meta.appendChild(document.createTextNode(bit));
  });
  if (!metaBits.length) { meta.hidden = true; }

  function addRow(label, value, href) {
    if (!value || !href) { return; }
    var a = document.createElement("a");
    a.className = "row";
    a.href = href;
    if (/^https?:/.test(href)) { a.rel = "noopener"; a.target = "_blank"; }

    var l = document.createElement("span");
    l.className = "label";
    l.textContent = label;

    var v = document.createElement("span");
    v.className = "value";
    v.textContent = value;

    a.appendChild(l);
    a.appendChild(v);
    $("rows").appendChild(a);
  }

  addRow("Email",    CONFIG.email,             CONFIG.email ? "mailto:" + CONFIG.email : "");
  addRow("Phone",    CONFIG.phone.display,     CONFIG.phone.dial ? "tel:" + CONFIG.phone.dial : "");
  addRow("LinkedIn", CONFIG.linkedin.display,  CONFIG.linkedin.url);
  addRow("GitHub",   CONFIG.github.display,    CONFIG.github.url);
  addRow("Website",  CONFIG.website.display,   CONFIG.website.url);

  if (CONFIG.footerNote) { $("footer").textContent = CONFIG.footerNote; }
  else { $("footer").hidden = true; }

  /* ---- vCard 3.0 ------------------------------------------------------ */

  // RFC 2426 §2.4.2: backslash, comma and semicolon are escaped in values.
  function esc(s) {
    return String(s || "").replace(/\\/g, "\\\\")
                          .replace(/\n/g, "\\n")
                          .replace(/,/g, "\\,")
                          .replace(/;/g, "\\;");
  }

  // RFC 2426 §2.6: fold long lines at 75 octets, continuations start with a space.
  function fold(line) {
    if (line.length <= 75) { return line; }
    var out = line.slice(0, 75), rest = line.slice(75);
    while (rest.length > 74) {
      out += "\r\n " + rest.slice(0, 74);
      rest = rest.slice(74);
    }
    return out + "\r\n " + rest;
  }

  function buildVCard() {
    var n = CONFIG.name;
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + esc(n.family) + ";" + esc(n.given) + ";" + esc(n.additional) + ";;",
      "FN:" + esc(n.full)
    ];

    if (CONFIG.org)      { lines.push("ORG:" + esc(CONFIG.org)); }
    if (CONFIG.role)     { lines.push("TITLE:" + esc(CONFIG.role)); }
    if (CONFIG.email)    { lines.push("EMAIL;TYPE=INTERNET,PREF:" + esc(CONFIG.email)); }
    if (CONFIG.phone.dial) {
      lines.push("TEL;TYPE=CELL,VOICE:" + esc(CONFIG.phone.dial));
    }
    if (CONFIG.website.url) { lines.push("URL:" + esc(CONFIG.website.url)); }
    if (CONFIG.linkedin.url) {
      lines.push("URL;TYPE=LinkedIn:" + esc(CONFIG.linkedin.url));
      lines.push("X-SOCIALPROFILE;TYPE=linkedin:" + esc(CONFIG.linkedin.url));
    }
    if (CONFIG.github.url) {
      lines.push("URL;TYPE=GitHub:" + esc(CONFIG.github.url));
      lines.push("X-SOCIALPROFILE;TYPE=github:" + esc(CONFIG.github.url));
    }
    if (CONFIG.location) { lines.push("NOTE:" + esc(CONFIG.location)); }

    lines.push("REV:" + new Date().toISOString().replace(/\.\d{3}/, ""));
    lines.push("END:VCARD");

    return lines.map(fold).join("\r\n") + "\r\n";
  }

  /* ---- Download ------------------------------------------------------- */

  var btn = $("save");
  var status = $("status");
  var defaultLabel = btn.textContent;
  var resetTimer;

  btn.addEventListener("click", function () {
    var blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");

    a.href = url;
    a.download = CONFIG.vcardFilename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);

    btn.textContent = "Contact downloaded";
    btn.setAttribute("data-done", "1");
    status.textContent = "Contact card downloaded as " + CONFIG.vcardFilename;

    clearTimeout(resetTimer);
    resetTimer = setTimeout(function () {
      btn.textContent = defaultLabel;
      btn.removeAttribute("data-done");
      status.textContent = "";
    }, 4000);
  });
})();
</script>
</body>
</html>
