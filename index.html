<link rel="canonical" href="https://ingeduardoromero.github.io/virtual-card/">

<style>
  /* ---- Palette ----------------------------------------------------------
     A white contact card floating on a cool grey page, dusk-gradient banner,
     one blue accent. Brand hues live only inside their own icon tiles.
     No webfonts: the system stack paints on the first frame.
     --------------------------------------------------------------------- */
  :root {
    --page:      #EEF1F5;
    --surface:   #FFFFFF;
    --ink:       #10151C;
    --muted:     #667085;
    --accent:    #1B62CF;
    --accent-ink:#FFFFFF;
    --hairline:  rgba(16,21,28,.09);
    --press:     rgba(16,21,28,.05);
    --shadow:    0 1px 2px rgba(16,21,28,.05), 0 12px 32px -12px rgba(16,21,28,.18);
    --band-1:    #0E2A52;   /* banner: deep dusk ... */
    --band-2:    #1B62CF;   /* ... through blue ... */
    --band-3:    #E8863A;   /* ... to a warm horizon */
    --wa:        #25D366;
    --li:        #0A66C2;
    --tel:       #4A5A6B;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:     #0B0D10;
      --surface:  #14181D;
      --ink:      #EDF0F4;
      --muted:    #949CA8;
      --accent:   #4C8DF6;
      --accent-ink:#0B0D10;
      --hairline: rgba(237,240,244,.11);
      --press:    rgba(237,240,244,.06);
      --shadow:   0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding:
      calc(env(safe-area-inset-top) + 1.25rem)
      calc(env(safe-area-inset-right) + 1rem)
      calc(env(safe-area-inset-bottom) + 2.5rem)
      calc(env(safe-area-inset-left) + 1rem);
  }

  .card {
    max-width: 27rem;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ---- Banner + avatar ---- */
  .banner {
    height: 8.25rem;
    background:
      radial-gradient(120% 140% at 78% 108%, var(--band-3) 0%, transparent 52%),
      linear-gradient(168deg, var(--band-1) 8%, var(--band-2) 96%);
  }

  .identity { padding: 0 1.5rem 1.5rem; text-align: center; }

  .avatar {
    width: 6.5rem; height: 6.5rem;
    margin: -3.25rem auto 0;
    border-radius: 50%;
    background: var(--surface);
    border: 4px solid var(--surface);
    box-shadow: 0 2px 10px rgba(16,21,28,.14);
    display: grid; place-items: center;
    overflow: hidden;
    position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar .mono {
    width: 100%; height: 100%;
    display: grid; place-items: center;
    background: linear-gradient(160deg, var(--band-1), var(--band-2));
    color: #fff;
    font-size: 2.125rem; font-weight: 600; letter-spacing: -0.02em;
  }

  h1 {
    margin: .875rem 0 0;
    font-size: clamp(1.5rem, 6.6vw, 1.9375rem);
    font-weight: 700;
    letter-spacing: -0.028em;
    line-height: 1.12;
    text-wrap: balance;
  }
  .role {
    margin: .3125rem 0 0;
    color: var(--accent);
    font-size: .9375rem;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .tagline { margin: .625rem 0 0; color: var(--muted); font-size: .9375rem; }
  .place {
    margin: .5rem 0 0; color: var(--muted); font-size: .8125rem;
    display: inline-flex; align-items: center; gap: .3125rem;
  }
  .place svg { width: .875rem; height: .875rem; flex: none; }

  /* ---- Actions ---- */
  .actions {
    display: flex; gap: .625rem;
    padding: 0 1.5rem 1.5rem;
  }
  .save {
    flex: 1;
    padding: .9375rem 1rem;
    border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-family: inherit; font-size: 1rem; font-weight: 600;
    letter-spacing: -0.005em;
    cursor: pointer; -webkit-appearance: none; appearance: none;
    transition: opacity .12s ease;
  }
  .save:active { opacity: .8; }
  .save[data-done="1"] {
    background: transparent; color: var(--accent);
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  .share {
    width: 3.25rem; flex: none;
    border: 0; border-radius: 999px;
    background: var(--press); color: var(--ink);
    display: grid; place-items: center;
    cursor: pointer; -webkit-appearance: none; appearance: none;
    transition: opacity .12s ease;
  }
  .share:active { opacity: .7; }
  .share svg { width: 1.25rem; height: 1.25rem; }

  /* ---- Channel grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: .25rem;
    padding: 1.25rem .75rem 1.5rem;
    border-top: 1px solid var(--hairline);
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
    padding: .875rem .5rem;
    border-radius: 14px;
    color: inherit; text-decoration: none;
    transition: background-color .12s ease;
  }
  .tile:active { background-color: var(--press); }
  .tile .glyph {
    width: 3.375rem; height: 3.375rem;
    border-radius: 17px;
    display: grid; place-items: center;
    color: #fff;
    box-shadow: 0 2px 8px -2px rgba(16,21,28,.35);
  }
  .tile .glyph svg { width: 1.75rem; height: 1.75rem; }
  .tile .label { font-size: .8125rem; font-weight: 500; letter-spacing: -0.005em; }
  .tile .sub {
    font-size: .6875rem; color: var(--muted);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---- Accessibility ---- */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<main class="card">
  <div class="banner" aria-hidden="true"></div>

  <div class="identity">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="tagline" id="tagline"></p>
    <p class="place" id="place" hidden></p>
  </div>

  <div class="actions">
    <button class="save" id="save" type="button">Save contact</button>
    <button class="share" id="share" type="button" aria-label="Share this card" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v13M12 3 8 7M12 3l4 4"/>
        <path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/>
      </svg>
    </button>
  </div>

  <p class="sr-only" role="status" aria-live="polite" id="status"></p>

  <nav class="grid" id="grid" aria-label="Ways to reach me"></nav>
</main>

<noscript>
  <p style="max-width:27rem;margin:1rem auto;text-align:center;color:#667085">
    This card needs JavaScript to render. Email: ingeduardoromero&#64;gmail.com
  </p>
</noscript>

<script>
(function () {
  "use strict";

  /* =====================================================================
     CONFIG — everything personal lives here. Edit only this object.
     Leave any string empty ("") to hide that item entirely.
     ===================================================================== */
  var CONFIG = {
    // `full` is displayed; the parts below build the vCard's structured N: field.
    name: {
      full:       "Eduardo Angel Romero Diaz",
      given:      "Eduardo",
      additional: "Angel",
      family:     "Romero Diaz"
    },

    initials: "ER",            // shown in the circle when `photo` is empty
    photo:    "",              // e.g. "me.jpg" next to index.html, or a data: URI

    role:     "Master of Software Engineering",
    tagline:  "Tap Save contact and skip the typing.",
    location: "",              // e.g. "Mexico City, Mexico" — hidden while empty
    org:      "",              // vCard ORG field — hidden while empty

    email: "ingeduardoromero@gmail.com",

    // Full international format. `display` is read by the visitor, `dial` is
    // what the phone actually calls and what goes into the vCard.
    phone: {
      display: "+52 55 4363 4088",
      dial:    "+525543634088"
    },

    // WhatsApp wants digits only — no +, no spaces. Mexican mobiles are
    // sometimes registered with a 1 after the country code: if wa.me/52...
    // says the number is invalid, try "5215543634088" instead.
    whatsapp: {
      number:  "525543634088",
      message: ""              // optional pre-filled first message
    },

    linkedin: {
      url:     "https://www.linkedin.com/in/eduardo-angel-romero-542a5350",
      display: "eduardo-angel-romero"
    },

    // Fill both fields to add a tile, e.g.
    // github: { url: "https://github.com/ingeduardoromero", display: "ingeduardoromero" },
    github:  { url: "", display: "" },
    website: { url: "", display: "" },

    vcardFilename: "Eduardo-Angel-Romero-Diaz.vcf"
  };
  /* ================== end CONFIG — nothing below needs editing ========== */

  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = "http://www.w3.org/2000/svg";

  /* ---- Icons: simplified glyphs, drawn here rather than borrowed -------- */
  var ICONS = {
    mail:  '<path d="M3.6 7.2A2.6 2.6 0 0 1 6.2 4.6h11.6a2.6 2.6 0 0 1 2.6 2.6v9.6a2.6 2.6 0 0 1-2.6 2.6H6.2a2.6 2.6 0 0 1-2.6-2.6z" fill="none" stroke="currentColor" stroke-width="1.7"/>'
         + '<path d="m4.6 7.6 7.4 5.4 7.4-5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
    phone: '<path d="M7.1 3.4h2.6l1.5 3.8-1.9 1.3a11.6 11.6 0 0 0 5.2 5.2l1.3-1.9 3.8 1.5v2.6a2 2 0 0 1-2.2 2A16.2 16.2 0 0 1 5.1 5.6a2 2 0 0 1 2-2.2z" fill="currentColor"/>',
    wa:    '<path d="M12 2.9a9 9 0 0 0-7.7 13.7L3 21.4l4.9-1.3A9 9 0 1 0 12 2.9z" fill="currentColor"/>'
         + '<path d="M8.6 7.2h1.7l1 2.5-1.3.9a7.6 7.6 0 0 0 3.4 3.4l.9-1.3 2.5 1v1.7a1.4 1.4 0 0 1-1.5 1.4A10.6 10.6 0 0 1 7.2 8.7a1.4 1.4 0 0 1 1.4-1.5z" fill="var(--wa)"/>',
    li:    '<path d="M4.6 8.6h2.9v10.8H4.6z" fill="currentColor"/>'
         + '<circle cx="6.05" cy="5.4" r="1.75" fill="currentColor"/>'
         + '<path d="M10.1 8.6H13v1.5a3.4 3.4 0 0 1 3-1.7c2.4 0 3.9 1.6 3.9 4.6v6.4h-2.9v-5.9c0-1.5-.6-2.4-1.9-2.4-1.1 0-1.7.7-2 1.5-.1.3-.1.7-.1 1v5.8h-2.9z" fill="currentColor"/>',
    globe: '<circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/>'
         + '<path d="M3.4 12h17.2M12 3.4a13 13 0 0 1 0 17.2 13 13 0 0 1 0-17.2z" fill="none" stroke="currentColor" stroke-width="1.7"/>',
    code:  '<path d="m8.8 8.4-4 3.6 4 3.6M15.2 8.4l4 3.6-4 3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>'
         + '<path d="m13.4 5.6-2.8 12.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
    pin:   '<path d="M12 21s6.5-6 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8"/>'
         + '<circle cx="12" cy="10.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/>'
  };

  function svg(paths, cls) {
    var s = document.createElementNS(SVGNS, "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("aria-hidden", "true");
    if (cls) { s.setAttribute("class", cls); }
    s.innerHTML = paths;
    return s;
  }

  /* ---- Render ---------------------------------------------------------- */

  var avatar = $("avatar");
  if (CONFIG.photo) {
    var img = document.createElement("img");
    img.src = CONFIG.photo;
    img.alt = CONFIG.name.full;
    avatar.appendChild(img);
  } else {
    var mono = document.createElement("span");
    mono.className = "mono";
    mono.textContent = CONFIG.initials;
    mono.setAttribute("aria-hidden", "true");
    avatar.appendChild(mono);
  }

  $("name").textContent = CONFIG.name.full;

  var roleBits = [CONFIG.role, CONFIG.org].filter(Boolean);
  if (roleBits.length) { $("role").textContent = roleBits.join(" · "); }
  else { $("role").hidden = true; }

  if (CONFIG.tagline) { $("tagline").textContent = CONFIG.tagline; }
  else { $("tagline").hidden = true; }

  if (CONFIG.location) {
    var place = $("place");
    place.hidden = false;
    place.appendChild(svg(ICONS.pin));
    place.appendChild(document.createTextNode(CONFIG.location));
  }

  function addTile(opts) {
    if (!opts.href) { return; }
    var a = document.createElement("a");
    a.className = "tile";
    a.href = opts.href;
    if (/^https?:/.test(opts.href)) { a.rel = "noopener"; a.target = "_blank"; }
    a.setAttribute("aria-label", opts.label + ": " + opts.sub);

    var g = document.createElement("span");
    g.className = "glyph";
    g.style.background = opts.color;
    g.appendChild(svg(opts.icon));

    var l = document.createElement("span");
    l.className = "label";
    l.textContent = opts.label;

    var s = document.createElement("span");
    s.className = "sub";
    s.textContent = opts.sub;

    a.appendChild(g); a.appendChild(l); a.appendChild(s);
    $("grid").appendChild(a);
  }

  function waHref() {
    if (!CONFIG.whatsapp.number) { return ""; }
    return "https://wa.me/" + CONFIG.whatsapp.number
         + (CONFIG.whatsapp.message ? "?text=" + encodeURIComponent(CONFIG.whatsapp.message) : "");
  }

  addTile({ label: "WhatsApp", sub: CONFIG.phone.display, icon: ICONS.wa,
            color: "var(--wa)", href: waHref() });
  addTile({ label: "Call", sub: CONFIG.phone.display, icon: ICONS.phone,
            color: "var(--tel)", href: CONFIG.phone.dial ? "tel:" + CONFIG.phone.dial : "" });
  addTile({ label: "Email", sub: CONFIG.email, icon: ICONS.mail,
            color: "var(--accent)", href: CONFIG.email ? "mailto:" + CONFIG.email : "" });
  addTile({ label: "LinkedIn", sub: CONFIG.linkedin.display, icon: ICONS.li,
            color: "var(--li)", href: CONFIG.linkedin.url });
  addTile({ label: "GitHub", sub: CONFIG.github.display, icon: ICONS.code,
            color: "#24292F", href: CONFIG.github.url });
  addTile({ label: "Website", sub: CONFIG.website.display, icon: ICONS.globe,
            color: "#0E7C86", href: CONFIG.website.url });

  /* ---- vCard 3.0 ------------------------------------------------------- */

  // RFC 2426 2.4.2: backslash, comma and semicolon are escaped in values.
  function esc(s) {
    return String(s || "").replace(/\\/g, "\\\\")
                          .replace(/\n/g, "\\n")
                          .replace(/,/g, "\\,")
                          .replace(/;/g, "\\;");
  }

  // RFC 2426 2.6: fold long lines at 75 octets, continuations start with a space.
  function fold(line) {
    if (line.length <= 75) { return line; }
    var out = line.slice(0, 75), rest = line.slice(75);
    while (rest.length > 74) {
      out += "\r\n " + rest.slice(0, 74);
      rest = rest.slice(74);
    }
    return out + "\r\n " + rest;
  }

  function buildVCard() {
    var n = CONFIG.name;
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + esc(n.family) + ";" + esc(n.given) + ";" + esc(n.additional) + ";;",
      "FN:" + esc(n.full)
    ];

    if (CONFIG.org)   { lines.push("ORG:" + esc(CONFIG.org)); }
    if (CONFIG.role)  { lines.push("TITLE:" + esc(CONFIG.role)); }
    if (CONFIG.email) { lines.push("EMAIL;TYPE=INTERNET,PREF:" + esc(CONFIG.email)); }
    if (CONFIG.phone.dial) { lines.push("TEL;TYPE=CELL,VOICE:" + esc(CONFIG.phone.dial)); }
    if (CONFIG.whatsapp.number) {
      lines.push("X-SOCIALPROFILE;TYPE=whatsapp:https://wa.me/" + esc(CONFIG.whatsapp.number));
    }
    if (CONFIG.website.url) { lines.push("URL:" + esc(CONFIG.website.url)); }
    if (CONFIG.linkedin.url) {
      lines.push("URL;TYPE=LinkedIn:" + esc(CONFIG.linkedin.url));
      lines.push("X-SOCIALPROFILE;TYPE=linkedin:" + esc(CONFIG.linkedin.url));
    }
    if (CONFIG.github.url) {
      lines.push("URL;TYPE=GitHub:" + esc(CONFIG.github.url));
      lines.push("X-SOCIALPROFILE;TYPE=github:" + esc(CONFIG.github.url));
    }
    if (CONFIG.location) { lines.push("NOTE:" + esc(CONFIG.location)); }

    lines.push("REV:" + new Date().toISOString().replace(/\.\d{3}/, ""));
    lines.push("END:VCARD");

    return lines.map(fold).join("\r\n") + "\r\n";
  }

  /* ---- Save contact ---------------------------------------------------- */

  var btn = $("save"), status = $("status");
  var defaultLabel = btn.textContent, resetTimer;

  btn.addEventListener("click", function () {
    var blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");

    a.href = url;
    a.download = CONFIG.vcardFilename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);

    btn.textContent = "Contact downloaded";
    btn.setAttribute("data-done", "1");
    status.textContent = "Contact card downloaded as " + CONFIG.vcardFilename;

    clearTimeout(resetTimer);
    resetTimer = setTimeout(function () {
      btn.textContent = defaultLabel;
      btn.removeAttribute("data-done");
      status.textContent = "";
    }, 4000);
  });

  /* ---- Share this card ------------------------------------------------- */

  var share = $("share");
  if (navigator.share || navigator.clipboard) {
    share.hidden = false;
    share.addEventListener("click", function () {
      var payload = { title: CONFIG.name.full, text: CONFIG.role, url: location.href };
      if (navigator.share) {
        navigator.share(payload).catch(function () { /* dismissed — nothing to do */ });
      } else {
        navigator.clipboard.writeText(location.href).then(function () {
          status.textContent = "Link copied";
        });
      }
    });
  }
})();
</script>
</body>
</html>
